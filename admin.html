<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel | Discipleship Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="page-shell">
      <div id="loginView" class="login-view hidden">
        <div class="login-card">
          <p class="eyebrow">Admin</p>
          <h1>Sign in to the admin panel</h1>
          <p class="login-copy">Manage people in the discipleship tracker.</p>

          <form id="loginForm" class="form-grid">
            <label>
              <span>Username</span>
              <input
                id="loginUsername"
                name="username"
                type="text"
                required
                autocomplete="username"
              />
            </label>

            <label>
              <span>Password</span>
              <input
                id="loginPassword"
                name="password"
                type="password"
                required
                autocomplete="current-password"
              />
            </label>

            <p id="loginError" class="login-error hidden" role="alert"></p>

            <button class="primary-btn" type="submit">Sign in</button>
          </form>

          <p class="login-back"><a href="index.html">← Back to the tree map</a></p>
        </div>
      </div>

      <div id="panelView" class="panel-view hidden">
        <header class="panel-header">
          <div>
            <p class="eyebrow">Discipleship Tracker</p>
            <h1>Admin Panel</h1>
          </div>
          <div class="panel-actions">
            <a class="secondary-btn link-btn" href="index.html">View tree map</a>
            <button id="logoutBtn" class="secondary-btn" type="button">
              Log out
            </button>
          </div>
        </header>

        <section class="panel-card">
          <div class="panel-card-head">
            <h2>Add a person</h2>
          </div>
          <form id="personForm" class="form-grid">
            <div class="form-row">
              <label>
                <span>Name</span>
                <input
                  id="nameInput"
                  name="name"
                  type="text"
                  required
                  placeholder="e.g. John Doe"
                />
              </label>

              <label>
                <span>Address (optional)</span>
                <input
                  name="address"
                  type="text"
                  placeholder="e.g. Santiago City"
                />
              </label>
            </div>

            <div class="form-row">
              <label>
                <span>Birthday</span>
                <input name="bday" type="date" />
              </label>

              <label>
                <span>Age</span>
                <input name="age" type="number" min="0" max="150" />
              </label>
            </div>

            <div class="form-row">
              <label>
                <span>Civil Status</span>
                <select name="civilStatus">
                  <option value="">Select…</option>
                  <option>Single</option>
                  <option>Married</option>
                  <option>Widowed</option>
                  <option>Separated</option>
                  <option>Engaged</option>
                </select>
              </label>

              <label>
                <span>Mobile Number</span>
                <input
                  name="mobileNumber"
                  type="tel"
                  placeholder="e.g. 0917 123 4567"
                />
              </label>
            </div>

            <div class="form-row">
              <label>
                <span>LCC File No. (optional)</span>
                <input name="lccFileNo" type="text" />
              </label>

              <label>
                <span>Series (optional)</span>
                <input name="series" type="text" />
              </label>
            </div>

            <div class="form-row">
              <label>
                <span>Discipler</span>
                <select id="disciplerInput" name="discipler"></select>
              </label>

              <label>
                <span>Role</span>
                <select id="roleInput" name="role">
                  <option value="Disciple">Disciple</option>
                  <option value="Pastor">Pastor</option>
                  <option value="National Office">National Office</option>
                </select>
              </label>
            </div>

            <fieldset class="modules-fieldset">
              <legend>Modules</legend>
              <div id="moduleOptions" class="module-groups"></div>
            </fieldset>

            <div class="form-actions">
              <button class="primary-btn" type="submit">Add person</button>
            </div>
          </form>
        </section>

        <section class="panel-card">
          <div class="panel-card-head">
            <h2>All people</h2>
            <span id="peopleCount" class="tree-pill"></span>
          </div>
          <div class="table-wrap">
            <table class="people-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Role</th>
                  <th>Discipler</th>
                  <th>Modules</th>
                  <th>Status</th>
                  <th class="actions-col">Actions</th>
                </tr>
              </thead>
              <tbody id="peopleTableBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <div
      id="editModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="editModalTitle"
    >
      <div class="modal-card">
        <div class="modal-head">
          <h3 id="editModalTitle">Edit person</h3>
          <button
            id="closeEditModalBtn"
            class="icon-btn"
            type="button"
            aria-label="Close edit form"
          >
            ×
          </button>
        </div>

        <form id="editForm" class="form-grid">
          <div class="form-row">
            <label>
              <span>Name</span>
              <input id="editNameInput" name="name" type="text" required />
            </label>

            <label>
              <span>Address (optional)</span>
              <input id="editAddressInput" name="address" type="text" />
            </label>
          </div>

          <div class="form-row">
            <label>
              <span>Birthday</span>
              <input id="editBdayInput" name="bday" type="date" />
            </label>

            <label>
              <span>Age</span>
              <input id="editAgeInput" name="age" type="number" min="0" max="150" />
            </label>
          </div>

          <div class="form-row">
            <label>
              <span>Civil Status</span>
              <select id="editCivilStatusInput" name="civilStatus">
                <option value="">Select…</option>
                <option>Single</option>
                <option>Married</option>
                <option>Widowed</option>
                <option>Separated</option>
                <option>Engaged</option>
              </select>
            </label>

            <label>
              <span>Mobile Number</span>
              <input id="editMobileInput" name="mobileNumber" type="tel" />
            </label>
          </div>

          <div class="form-row">
            <label>
              <span>LCC File No. (optional)</span>
              <input id="editLccInput" name="lccFileNo" type="text" />
            </label>

            <label>
              <span>Series (optional)</span>
              <input id="editSeriesInput" name="series" type="text" />
            </label>
          </div>

            <div class="form-row">
              <label>
                <span>Discipler</span>
                <select id="editDisciplerInput" name="discipler"></select>
              </label>

              <label>
                <span>Role</span>
                <select id="editRoleInput" name="role">
                  <option value="Disciple">Disciple</option>
                  <option value="Pastor">Pastor</option>
                  <option value="National Office">National Office</option>
                </select>
              </label>
            </div>

          <fieldset class="modules-fieldset">
            <legend>Modules</legend>
            <div id="editModuleOptions" class="module-groups"></div>
          </fieldset>

          <div class="form-actions">
            <button id="cancelEditBtn" class="secondary-btn" type="button">
              Cancel
            </button>
            <button class="primary-btn" type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div
      id="deleteModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="deleteModalTitle"
    >
      <div class="modal-card confirm-card">
        <div class="modal-head">
          <h3 id="deleteModalTitle">Delete person</h3>
          <button
            id="closeDeleteModalBtn"
            class="icon-btn"
            type="button"
            aria-label="Close delete confirmation"
          >
            ×
          </button>
        </div>

        <p id="deleteModalMessage" class="confirm-copy"></p>

        <div class="form-actions">
          <button id="cancelDeleteBtn" class="secondary-btn" type="button">
            Cancel
          </button>
          <button id="confirmDeleteBtn" class="danger-btn" type="button">
            Delete
          </button>
        </div>
      </div>
    </div>

    <script src="toast.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
